name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Run Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint and format check
        run: bunx eslint .

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bunx tsc --noEmit

      - name: Compile standalone binary
        run: bun run compile

      - name: Smoke test binary (views embedded, serves a file)
        run: |
          cd "$(mktemp -d)"
          echo hello > hello.txt
          "$GITHUB_WORKSPACE/dist/drop" hello.txt -t 30s -p 18080 --host 127.0.0.1 > out.txt 2>&1 &
          sleep 2
          cat out.txt
          url=$(grep -oE 'http://127.0.0.1:18080/[a-z0-9-]+' out.txt)
          curl -fsS "$url" | grep -q hello.txt
          curl -fsS "$url?download=1" | grep -q hello
          kill %1
